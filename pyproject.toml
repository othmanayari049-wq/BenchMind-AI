[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "benchmind-ai"
version = "0.1.0"
description = "Multimodal multi-agent engineering debugging platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "BenchMind AI contributors" }]
dependencies = [
  "fastapi>=0.139.2,<0.140",
  "uvicorn[standard]>=0.51,<0.52",
  "pydantic>=2.13.4,<2.14",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<0.1",
  "pypdf>=5.9,<6",
]

[project.optional-dependencies]
openai = ["openai>=2.45,<3"]
mcp = ["mcp[cli]>=2.0,<3"]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "openai>=2.45,<3",
  "mcp[cli]>=2.0,<3",
  "pip-audit>=2.9,<3",
]

[project.scripts]
benchmind = "benchmind.cli:main"
benchmind-mcp = "benchmind.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/benchmind"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["benchmind"]
mypy_path = "backend"
warn_unused_ignores = true

[tool.coverage.run]
source = ["backend/benchmind"]
