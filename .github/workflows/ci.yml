name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check backend tests
      - name: Ruff format
        run: ruff format --check backend tests
      - name: Mypy
        run: mypy backend/benchmind
      - name: Tests
        run: pytest
      - name: Dependency audit
        run: pip-audit
      - name: Deterministic benchmark fixtures
        run: PYTHONPATH=backend python benchmarks/evaluate.py
      - name: API startup smoke test
        run: |
          uvicorn benchmind.api:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/benchmind-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/benchmind-api.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --request POST \
            http://127.0.0.1:8000/api/v1/demo/esp32_wrong_gpio > /tmp/demo.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/health.json").read_text())
          demo = json.loads(Path("/tmp/demo.json").read_text())
          assert health["status"] == "ok"
          assert health["provider"] == "mock"
          assert demo["diagnosis"]["primary"]["title"] == "ECHO pin-definition mismatch"
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t benchmind-backend:test .
      - name: Build frontend image
        run: docker build -t benchmind-frontend:test frontend
      - name: Smoke-test backend container
        run: |
          docker run --detach --name benchmind-backend-test --publish 8001:8000 benchmind-backend:test
          trap 'docker rm --force benchmind-backend-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..25}; do
            if curl --fail --silent http://127.0.0.1:8001/health > /tmp/docker-health.json; then
              break
            fi
            if [ "$attempt" -eq 25 ]; then
              docker logs benchmind-backend-test
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --request POST \
            http://127.0.0.1:8001/api/v1/demo/esp32_wrong_gpio > /tmp/docker-demo.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/docker-health.json").read_text())
          demo = json.loads(Path("/tmp/docker-demo.json").read_text())
          assert health["status"] == "ok"
          assert health["provider"] == "mock"
          assert demo["verification"]["accepted"] is True
          PY
