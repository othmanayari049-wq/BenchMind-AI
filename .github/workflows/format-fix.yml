name: One-off Ruff format

on:
  push:
    branches: ["ci/format-fix"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/format-fix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.2'
      - name: Apply safe lint fixes
        run: ruff check --fix backend tests || true
      - name: Format Python
        run: ruff format backend tests
      - name: Commit formatted source
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend tests
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:ci/format-fix
      - name: Report remaining lint findings
        run: ruff check backend tests || true
